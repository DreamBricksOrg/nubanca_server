<!doctype html>
<html>
  <head>
    <title>editor</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include "_pwa.html" %}
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/editor.css', v='print-history-1') }}"
    />
  </head>
  <body data-print-scope="{{ [config.AWS_S3_BUCKET, config.EVENT_LOCATION, config.PRINTER_NAME]|tojson|forceescape }}">
    <header>
      <img
        id="logo"
        src="{{ url_for('static', filename='img/logo-white.png') }}"
        alt="Logo"
      />
    </header>
    <div id="loading">
      <div class="spinner"></div>
    </div>
    <div id="middle">
      <div id="editor">
        <canvas id="canvas2"></canvas>
        <canvas id="canvas1"></canvas>
      </div>
    </div>
    <footer>
      <button id="saveImage" class="btn btn-primary">Imprimir</button>
      <button id="qrcodeOnly" type="button" class="btn btn-secondary">Apenas Digital</button>
    </footer>
  </body>
  <script>
    const BASE_URL = "{{ server_url }}";
    const coverImagePath =
      "{{ url_for('static', filename='img/capa_revista_V8.png') }}";
  </script>
  <script src="{{ url_for('static', filename='js/print_history.js', v='print-history-1') }}"></script>
  <script src="{{ url_for('static', filename='js/editor.js', v='editor-wait-1') }}"></script>
  <script src="{{ url_for('static', filename='js/logo_back.js') }}"></script>
</html>

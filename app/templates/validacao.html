<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>validacao</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/validacao.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css"
    />
  </head>
  <body>
    <header>
      <img
        id="logo"
        src="{{ url_for('static', filename='img/logo-white.png') }}"

          <path
            d="M6.75827 17.2426L12.0009 12M17.2435 6.75736L12.0009 12M12.0009 12L6.75827 6.75736M12.0009 12L17.2435 17.2426"

      <button id="approved" class="btn btn-primary">

      const timer_pooling = parseInt("{{ timer_pooling }}");
    </script>
    <script src="{{ url_for('static', filename='js/validacao.js') }}"></script>
    <script src="{{ url_for('static', filename='js/logo_back.js') }}"></script>

</html>
